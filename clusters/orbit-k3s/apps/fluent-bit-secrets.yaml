apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: orbit-k3s-fluent-bit-secrets
  namespace: argocd
spec:
  project: orbit-k3s-addons
  source:
    repoURL: https://github.com/ORBIT-CLOUD-LABS/orbit-gitops.git
    targetRevision: develop
    path: addons/fluent-bit/secrets
  destination:
    server: https://kubernetes.default.svc
    namespace: fluent-bit
  syncPolicy:
    automated:
      enabled: true
      prune: false
      selfHeal: false
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
    syncOptions:
      # CRD는 ESO Application에서 설치. 실제 적용 실패는 ESO 준비 후 재시도.
      - SkipDryRunOnMissingResource=true
