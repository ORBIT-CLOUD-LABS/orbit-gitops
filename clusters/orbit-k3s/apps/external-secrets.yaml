apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: orbit-k3s-external-secrets
  namespace: argocd
spec:
  project: orbit-k3s-addons
  source:
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    targetRevision: "2.14.0"
    helm:
      releaseName: external-secrets
      valuesObject:
        installCRDs: true
        serviceAccount:
          create: true
          name: external-secrets
        # TokenRequest로 단기 SA 토큰 발급. TokenReview binding은 Vault 연결 선언에서 관리.
        rbac:
          create: true
          serviceAccountTokenCreate: true
        # chart 기본값은 release tag를 사용하므로 세 구성요소 모두 digest로 고정.
        image:
          tag: v2.14.0@sha256:10608eb53e636e744903d5f3657a4d9c44e28d9d9c181b73e07bc7dd2e6884dc
        webhook:
          image:
            tag: v2.14.0@sha256:10608eb53e636e744903d5f3657a4d9c44e28d9d9c181b73e07bc7dd2e6884dc
        certController:
          image:
            tag: v2.14.0@sha256:10608eb53e636e744903d5f3657a4d9c44e28d9d9c181b73e07bc7dd2e6884dc
        global:
          # 워커에는 worker 역할 라벨이 없음. control-plane 라벨이 있는 노드는 제외.
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: node-role.kubernetes.io/control-plane
                        operator: DoesNotExist
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      enabled: true
      prune: false
      selfHeal: false
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - ServerSideApply=true
