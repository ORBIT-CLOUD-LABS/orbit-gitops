apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: orbit-k3s-external-secrets-vault
  namespace: argocd
spec:
  project: orbit-k3s-addons
  source:
    repoURL: https://github.com/ORBIT-CLOUD-LABS/orbit-gitops.git
    targetRevision: develop
    path: addons/external-secrets
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      enabled: true
      prune: false
      selfHeal: false
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
    syncOptions:
      # ESO CRD는 별도 Application에서 설치. 첫 설치 중 CRD 부재로 인한 dry-run을 생략.
      # 실제 적용·webhook 실패는 오류로 남고 CRD와 ESO 준비 후 재시도한다.
      - SkipDryRunOnMissingResource=true
