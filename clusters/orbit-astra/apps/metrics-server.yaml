apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: orbit-astra-metrics-server
  namespace: argocd
spec:
  project: platform
  source:
    repoURL: https://kubernetes-sigs.github.io/metrics-server/
    chart: metrics-server
    # 3.13.1 = metrics-server 0.8.1 (Kubernetes 1.31+). 0.9.x 는 1.34+ 이므로 v1.33 에서 사용하지 않는다.
    targetRevision: 3.13.1
    helm:
      releaseName: metrics-server
      valuesObject:
        args:
          # kubeadm 기본 kubelet 서빙 인증서는 자체 서명이다(serverTLSBootstrap 미사용).
          # 검증 없이 수집하며, kubelet 인증서를 CA 서명으로 바꾸면 제거한다.
          - --kubelet-insecure-tls
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      enabled: true
      prune: false
      selfHeal: false
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
