apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: orbit-astra-alloy
  namespace: argocd
spec:
  project: platform
  sources:
    - repoURL: https://grafana.github.io/helm-charts
      chart: alloy
      targetRevision: 1.13.1
      helm:
        valueFiles:
          - $values/platform/alloy/values.yaml
        fileParameters:
          - name: alloy.configMap.content
            path: $values/platform/alloy/config.alloy
    - repoURL: git@github.com:ORBIT-CLOUD-LABS/orbit-gitops.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      enabled: false
      prune: false
      selfHeal: false
