apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: orbit-server
  namespace: orbit
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: orbit-server
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          # orbit#23 측정으로 확정 (#42). request 500m 기준이며, 목표 50%와 비교해 scale-out 시점
          # (부하 상승 약 30초 뒤)이 같고 새 Pod 예열 동안의 전환 구간도 짧아지지 않아 70%를 유지한다.
          averageUtilization: 70
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Pods
          value: 1
          periodSeconds: 30
