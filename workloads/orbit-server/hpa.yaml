apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: orbit-server
  namespace: orbit
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: orbit-server
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          # 임시 배포값. phase1 §4 미확정 값이며 orbit#23 사전 측정 후 CPU limit과 함께 확정한다.
          averageUtilization: 70
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Pods
          value: 1
          periodSeconds: 30
