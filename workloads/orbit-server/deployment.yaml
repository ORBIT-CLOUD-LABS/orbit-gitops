apiVersion: apps/v1
kind: Deployment
metadata:
  name: orbit-server
  namespace: orbit
spec:
  # replicas는 HPA(hpa.yaml)가 정하므로 적지 않는다.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: orbit-server
  template:
    metadata:
      labels:
        app: orbit-server
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 40
      nodeSelector:
        node-role.kubernetes.io/worker: ""
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: orbit-server
      containers:
        - name: orbit-server
          image: "ghcr.io/orbit-cloud-labs/orbit-server:b185ffeecd186cefbf3c5c0efef7c9497ffc3ae5@sha256:adafcf90f80839710febbf9c880477c30bc87cb62a33830a1496a7eba28ae358"
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: orbit-server-config
            - secretRef:
                name: orbit-server-secret
          resources:
            # CPU는 orbit#23 측정으로 확정한 값 (#42). HPA 사용률은 request 500m 기준이다.
            # limit을 request보다 높게 둔 이유: request=limit 500m에서는 막 기동한 Pod가 JIT 컴파일에 CPU를
            # 쓰느라 상한에 막혀 Pod당 수십 req/s에서도 응답이 밀리고 회복하지 못했다 (scale-out으로 들어온 새 Pod도 같다).
            # limit 1000m은 Pod 2개가 DB 한계 근처까지 처리해 HPA 효과가 드러나지 않아 750m으로 정했다.
            # requests ≠ limits라 QoS는 Burstable이다. 메모리는 768Mi (이 크기에서는 JVM이 Serial GC를 쓴다).
            requests:
              cpu: 500m
              memory: 768Mi
            limits:
              cpu: 750m
              memory: 768Mi
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]
          volumeMounts:
            - name: origin-files
              mountPath: /data/origin
      volumes:
        - name: origin-files
          persistentVolumeClaim:
            claimName: origin-files-rw
