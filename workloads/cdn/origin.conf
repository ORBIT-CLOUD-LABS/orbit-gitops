log_format origin_json escape=json
  '{"ts":"$time_iso8601","msec":"$msec","role":"origin","pod":"$hostname",'
  '"method":"$request_method","uri":"$uri","status":$status,'
  '"bytes":$body_bytes_sent,"request_time":$request_time}';
server {
    listen 8080;
    root /srv/origin;
    default_type application/octet-stream;
    gzip off;
    access_log /dev/stdout origin_json;
    error_log /dev/stderr warn;
    location = /healthz { access_log off; return 200 "ok\n"; }
    location ~ /\. { deny all; }
    location /firmware/ { autoindex off; try_files $uri =404; }
    location / { return 404; }
}
