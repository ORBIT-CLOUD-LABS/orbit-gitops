proxy_cache_path /var/cache/nginx/orbit levels=1:2 keys_zone=firmware:10m
                 max_size=1g inactive=30m use_temp_path=off;
log_format edge_json escape=json
  '{"ts":"$time_iso8601","msec":"$msec","role":"edge","pod":"$hostname",'
  '"method":"$request_method","uri":"$uri","status":$status,'
  '"bytes":$body_bytes_sent,"request_time":$request_time,'
  '"cache":"$upstream_cache_status","upstream":"$upstream_addr",'
  '"upstream_time":"$upstream_response_time","upstream_bytes":"$upstream_bytes_received"}';
server {
    listen 8080;
    gzip off;
    access_log /dev/stdout edge_json;
    error_log /dev/stderr warn;
    location = /healthz { access_log off; return 200 "ok\n"; }
    location ~ /\. { deny all; }
    location /firmware/ {
        proxy_pass http://cdn-origin.orbit.svc.cluster.local;
        proxy_cache firmware;
        proxy_cache_key "$scheme$proxy_host$request_uri";
        proxy_cache_valid 200 30m;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 60s;
        proxy_cache_lock_age 60s;
        proxy_connect_timeout 3s;
        proxy_read_timeout 60s;
        proxy_cache_use_stale off;
        proxy_next_upstream off;
        add_header X-Cache-Status $upstream_cache_status always;
        add_header X-Edge-ID $hostname always;
    }
    location / { return 404; }
}
