apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitops-deploy-test
  namespace: orbit-gitops-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gitops-deploy-test
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gitops-deploy-test
      annotations:
        orbit.dev/deploy-test-revision: v1
    spec:
      containers:
        - name: nginx
          image: nginx:1.30.6-alpine@sha256:ff8328b4279ec385af48cde9ef486e7165ad74b7065cb3cd86c377384e2e2dd5
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
