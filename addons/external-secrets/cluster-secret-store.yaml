apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: orbit-vault
spec:
  # 현재 사용자는 Fluent Bit뿐. 다른 namespace는 명시적으로 추가하기 전까지 허용하지 않음.
  conditions:
    - namespaces:
        - fluent-bit
  provider:
    vault:
      server: https://10.0.0.201:8200
      path: secret
      version: v2
      caProvider:
        type: ConfigMap
        name: vault-ca
        namespace: external-secrets
        key: vault-ca.crt
      auth:
        kubernetes:
          mountPath: kubernetes
          role: eso
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
            audiences:
              - https://kubernetes.default.svc.cluster.local
