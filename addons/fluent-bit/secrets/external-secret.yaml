apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: fluent-bit-elasticsearch
  namespace: fluent-bit
spec:
  refreshPolicy: Periodic
  refreshInterval: 1m
  secretStoreRef:
    name: orbit-vault
    kind: ClusterSecretStore
  target:
    name: fluent-bit-elasticsearch
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: password
      remoteRef:
        key: orbit/k3s/fluent-bit
        property: password
