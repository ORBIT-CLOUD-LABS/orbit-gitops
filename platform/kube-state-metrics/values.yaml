# Argo CD Application 이름이 orbit-astra-kube-state-metrics라 fullnameOverride 없이는
# Service·Deployment가 전부 orbit-astra-kube-state-metrics로 생성된다. config.alloy는
# kube-state-metrics.observability.svc.cluster.local 고정 DNS로 scrape하므로 이름을
# 고정해 둔다 — 안 그러면 Service가 "kube-state-metrics"라는 이름으로 존재하지 않아
# DNS 조회가 실패하고 Prometheus 쪽에서 이 target이 up=0(다운)으로 나온다.
fullnameOverride: kube-state-metrics

# orbit-infrastructure#57 플랫폼 권한 범위 내로 수집 대상을 제한한다.
# Deployment 상태·HPA 상태·Pod 상태만 필요하므로(orbit-gitops#10) 나머지 collector는 비활성화한다.
# secrets·configmaps 등 기본 collector는 클러스터 전체를 읽으므로 불필요한 노출을 막기 위해 끈다.
collectors:
  - deployments
  - horizontalpodautoscalers
  - pods
