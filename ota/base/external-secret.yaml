apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: orbit-server-secret
spec:
  refreshPolicy: Periodic
  refreshInterval: 1m
  secretStoreRef:
    name: orbit-vault
    kind: ClusterSecretStore
  target:
    name: orbit-server-secret
    creationPolicy: Owner
    deletionPolicy: Retain
  # 키를 하나씩 적는다. Vault에 키가 빠지면 Secret이 만들어지지 않아 바로 드러난다.
  # Secret 값이 바뀌어도 Pod는 다시 뜨지 않는다. 바꾼 뒤 Deployment를 재시작한다
  data:
    # RDS. DB_URL에 RDS 엔드포인트가 들어 있어 공개 저장소인 이 저장소에 두지 않는다 (Terraform 출력 orbit_server_db_url)
    - secretKey: DB_URL
      remoteRef:
        key: orbit/k3s/orbit-server
        property: db-url
    - secretKey: DB_USERNAME
      remoteRef:
        key: orbit/k3s/orbit-server
        property: db-username
    - secretKey: DB_PASSWORD
      remoteRef:
        key: orbit/k3s/orbit-server
        property: db-password
    # Origin S3 쓰기용 IAM 사용자 키
    - secretKey: ORIGIN_ACCESS_KEY
      remoteRef:
        key: orbit/k3s/orbit-server
        property: origin-access-key
    - secretKey: ORIGIN_SECRET_KEY
      remoteRef:
        key: orbit/k3s/orbit-server
        property: origin-secret-key
    - secretKey: ENROLLMENT_KEY
      remoteRef:
        key: orbit/k3s/orbit-server
        property: enrollment-key
    - secretKey: ADMIN_TOKEN
      remoteRef:
        key: orbit/k3s/orbit-server
        property: admin-token
    # 다운로드 URL 서명 값은 CDN Edge와 같은 값이어야 하므로 두 앱이 같이 읽는 경로에 둔다.
    # kid는 비밀이 아니지만 값과 함께 바뀌어야 하므로 같은 곳에 둔다
    - secretKey: CDN_URL_SIGNING_KEY_ID
      remoteRef:
        key: orbit/k3s/cdn-url-signing
        property: key-id
    - secretKey: CDN_URL_SIGNING_SECRET
      remoteRef:
        key: orbit/k3s/cdn-url-signing
        property: secret
